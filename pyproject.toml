[project]
name = "newtube"
version = "0.1.0"
description = "Private, self-hosted YouTube client with a local recommender"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "yt-dlp",          # keep current: `uv lock --upgrade-package yt-dlp`
    "yt-dlp-ejs",      # YouTube JS-challenge solver scripts (so nothing is fetched at runtime)
]

[project.optional-dependencies]
# Real text-embedding model on the GPU. Not installed by default: `uv sync --extra ml`.
ml = ["sentence-transformers>=3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
newtube = "newtube.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newtube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
